services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: productdb_test
      POSTGRES_USER: productuser
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productuser -d productdb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-test:
    build:
      context: .
      dockerfile: ./src/Company.Product.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      CONNECTION_STRINGS__DEFAULT: Host=postgres-test;Port=5432;Database=productdb_test;Username=productuser;Password=change-me
      DEPLOYMENT__MIGRATE_ON_STARTUP: "true"
      DEPLOYMENT__SEED_ON_STARTUP: "true"
    depends_on:
      postgres-test:
        condition: service_healthy

  test-runner:
    build:
      context: .
      dockerfile: ./src/Company.Product.Tests/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      TEST_API_BASE_URL: http://api-test:8080
      CONNECTION_STRINGS__DEFAULT: Host=postgres-test;Port=5432;Database=productdb_test;Username=productuser;Password=change-me
    depends_on:
      api-test:
        condition: service_started
