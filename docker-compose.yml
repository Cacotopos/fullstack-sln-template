services:
  seq:
    image: datalust/seq:latest
    container_name: product-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  postgres:
    image: postgres:17
    container_name: product-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-productdb}
      POSTGRES_USER: ${POSTGRES_USER:-productuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-productuser} -d ${POSTGRES_DB:-productdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./src/Company.Product.Api/Dockerfile
    container_name: product-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      CONNECTION_STRINGS__DEFAULT: ${CONNECTION_STRINGS__DEFAULT:-Host=postgres;Port=5432;Database=productdb;Username=productuser;Password=change-me}
      AUTH__AUTHORITY: ${AUTH__AUTHORITY:-}
      AUTH__CLIENT_ID: ${AUTH__CLIENT_ID:-}
      AUTH__CLIENT_SECRET: ${AUTH__CLIENT_SECRET:-}
      WEBHOOKS__SIGNING_SECRET: ${WEBHOOKS__SIGNING_SECRET:-change-me}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./src/Company.Product.Web/Dockerfile
    container_name: product-web
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
    ports:
      - "5002:8080"
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./src/Company.Product.Worker/Dockerfile
    container_name: product-worker
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      CONNECTION_STRINGS__DEFAULT: ${CONNECTION_STRINGS__DEFAULT:-Host=postgres;Port=5432;Database=productdb;Username=productuser;Password=change-me}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  seq_data:
